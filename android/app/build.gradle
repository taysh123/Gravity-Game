import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// Versioning (D-20): ONE version file, package.json. versionName is its semver `version`;
//   versionCode = MAJOR*1_000_000 + MINOR*10_000 + PATCH*100 + BUILD      (BUILD = `androidBuild`)
// The same rules live in scripts/lib/versionCode.mjs (`node scripts/version.mjs --code`). The `android-debug` job in
// .github/workflows/ci.yml compares that output with `./gradlew -q :app:printVersionCode` and fails on any mismatch.
// MINOR, PATCH and BUILD must each be 0-99 and the code at most Google Play's 2_100_000_000, otherwise the build
// fails. The rc label lives only in the git tag. See docs/release/RUNBOOK.md section 4.
def appVersionCap = 2100000000G
def packageJson = new JsonSlurper().parse(file('../../package.json'))
def semver = (packageJson.version instanceof String) ? (packageJson.version =~ /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/) : null
if (semver == null || !semver.matches()) {
    throw new GradleException("package.json version must be a plain MAJOR.MINOR.PATCH with no rc label (got '${packageJson.version}')")
}
def appMajor = new BigInteger(semver.group(1))
def appMinor = new BigInteger(semver.group(2))
def appPatch = new BigInteger(semver.group(3))
if (appMinor > 99G || appPatch > 99G) {
    throw new GradleException("package.json version '${packageJson.version}': MINOR and PATCH must each be 0-99")
}
if (!(packageJson.androidBuild instanceof Integer) || packageJson.androidBuild < 0 || packageJson.androidBuild > 99) {
    throw new GradleException("package.json androidBuild must be an integer 0-99 (got '${packageJson.androidBuild}')")
}
def appVersionCodeBig = appMajor * 1000000G + appMinor * 10000G + appPatch * 100G + packageJson.androidBuild
if (appVersionCodeBig > appVersionCap) {
    throw new GradleException("package.json version '${packageJson.version}' build ${packageJson.androidBuild} derives versionCode ${appVersionCodeBig}, above Google Play's maximum ${appVersionCap}")
}
def appVersionCode = appVersionCodeBig.intValueExact()
def appVersionName = packageJson.version as String

tasks.register('printVersionCode') {
    group = 'help'
    description = 'Prints the versionCode derived from package.json; the android-debug CI job fails if it differs from node scripts/version.mjs --code.'
    def printed = appVersionCode.toString()
    doLast {
        println printed
    }
}

// AdMob APP id (P00-T20). AndroidManifest.xml carries the ${admobAppId} placeholder; this decides its value per build type:
//   debug   -> Google's public TEST app id (a debug build, CI and a fresh clone work with no property and no AdMob account)
//   release -> the real id, given as -PADMOB_APP_ID=ca-app-pub-XXXXXXXXXXXXXXXX~NNNNNNNNNN (also accepted from ~/.gradle/gradle.properties)
// verifyReleaseAdmobAppId runs before any release variant is built (preReleaseBuild: bundleRelease, assembleRelease, lintRelease)
// and fails with a clear message when the property is missing, malformed, or Google's test id. A debug build never runs it.
// The same id must be ADMOB_PROD.appId in src/config/monetization.config.ts; `npm run release:check -- --admob-app-id <id>` compares them.
def googleTestAdmobPublisher = 'ca-app-pub-3940256099942544'
def googleTestAdmobAppId = 'ca-app-pub-3940256099942544~3347511713'
def releaseAdmobAppId = (project.findProperty('ADMOB_APP_ID') ?: '').toString().trim()

tasks.register('verifyReleaseAdmobAppId') {
    group = 'verification'
    description = 'Fails a release build unless -PADMOB_APP_ID is a real AdMob app id (not empty, not malformed, not Google\'s test id).'
    doLast {
        def howTo = "Pass your real AdMob app id (AdMob console > Apps): ./gradlew bundleRelease -PADMOB_APP_ID=ca-app-pub-XXXXXXXXXXXXXXXX~NNNNNNNNNN. " +
            "It must equal ADMOB_PROD.appId in src/config/monetization.config.ts. See docs/release/RUNBOOK.md section 6."
        if (releaseAdmobAppId.isEmpty()) {
            throw new GradleException("Release build refused: -PADMOB_APP_ID is missing, so the manifest would have no AdMob app id. " + howTo)
        }
        if (releaseAdmobAppId.contains(googleTestAdmobPublisher)) {
            throw new GradleException("Release build refused: -PADMOB_APP_ID is Google's TEST app id (${googleTestAdmobPublisher}), which serves test ads and earns nothing. " + howTo)
        }
        if (!(releaseAdmobAppId ==~ /^ca-app-pub-\d{16}~\d{10}$/)) {
            throw new GradleException("Release build refused: -PADMOB_APP_ID is not an AdMob app id (expected ca-app-pub-XXXXXXXXXXXXXXXX~NNNNNNNNNN, with a '~'). " + howTo)
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'verifyReleaseAdmobAppId' }

// Release signing — loaded from android/keystore.properties (gitignored; never committed).
// If the file is absent (fresh clone, web/CI, anyone without the keystore) the release build
// still configures and simply produces an UNSIGNED bundle — no crash, no hard dependency.
// With the file present, bundleRelease/assembleRelease are signed with your upload key.
// Generate the keystore + this file per docs/release/RUNBOOK.md §7 (see keystore.properties.example).
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace = "com.truestorylabs.gravityflow"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.truestorylabs.gravityflow"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            manifestPlaceholders = [admobAppId: googleTestAdmobAppId]
        }
        release {
            // Empty here when -PADMOB_APP_ID is missing; verifyReleaseAdmobAppId then stops the build before the manifest is merged.
            manifestPlaceholders = [admobAppId: releaseAdmobAppId]
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Only attach the signing config when the keystore is present, so builds
            // without secrets stay valid (they emit an unsigned release artifact).
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        apply plugin: 'com.google.firebase.crashlytics' // must come after google-services
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
