name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  web:
    name: Typecheck · Test · Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # `npm install` (not `npm ci`): the lockfile is reconciled on first install
      # because some native plugin deps (AdMob, RevenueCat) were added to
      # package.json without a local install (build machine had no disk). Once a
      # committed lockfile includes them, switch this to `npm ci` for reproducibility.
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          if-no-files-found: error

